name: stage1-stills

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: System info
        run: |
          nproc
          free -m

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Ensure browser
        run: npx remotion browser ensure

      - name: Composition info
        run: npx remotion compositions src/index.ts

      - name: Render 3 stills at 1440x2560
        run: |
          set -e
          mkdir -p out
          for f in 0 1012 2024; do
            start=$(date +%s)
            npx remotion still src/index.ts BridgeShort "out/still-f${f}-2k.png" \
              --frame=$f --scale=1.3333 --gl=swangle --timeout=600000 --log=info
            end=$(date +%s)
            echo "frame=$f seconds=$((end-start))" | tee -a out/timings.txt
            free -m | tee -a out/timings.txt
          done

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-stills
          path: |
            out/*.png
            out/timings.txt
          retention-days: 3
          if-no-files-found: warn
