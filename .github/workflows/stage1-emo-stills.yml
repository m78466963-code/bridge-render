name: stage1-emo-stills

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: System info
        run: |
          nproc
          free -m

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Ensure browser
        run: npx remotion browser ensure

      - name: Composition info
        run: npx remotion compositions src/emo-index.ts

      - name: Render 9 stills at 540x960
        run: |
          set -e
          mkdir -p out
          for f in 230 305 380 430 485 510 560 640 660; do
            start=$(date +%s)
            npx remotion still src/emo-index.ts EmuShort "out/emo-f${f}-540.png" \
              --frame=$f --scale=0.5 --gl=swangle --timeout=600000 --log=info
            end=$(date +%s)
            echo "frame=$f seconds=$((end-start))" | tee -a out/timings.txt
            free -m | tee -a out/timings.txt
          done

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-emo-stills
          path: |
            out/emo-*.png
            out/timings.txt
          retention-days: 3
          if-no-files-found: warn
